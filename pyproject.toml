[project]
name = "waifuhat2x"
version = "1.0.0"
description = "Incremental manga super-resolution for AMD Radeon GPUs via WSL2 and ROCm"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11.2,<13",
  "spandrel==0.4.2",
  "torch @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1.lw.gitff65f5bc-cp312-cp312-linux_x86_64.whl",
  "torchvision @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/torchvision-0.24.0%2Brocm7.2.1.gitb919bd0c-cp312-cp312-linux_x86_64.whl",
  "triton @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/triton-3.5.1%2Brocm7.2.1.gita272dfa8-cp312-cp312-linux_x86_64.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]
download = ["gdown==5.2.0"]

[project.scripts]
waifuhat2x = "waifuhat2x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waifuhat2x"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "hardlink"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
