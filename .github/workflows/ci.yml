name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Check lock file
        run: uv lock --check
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1" "torchvision==0.24.1"
          python -m pip install "numpy>=2.2,<3" "pillow>=11.2,<13" "spandrel==0.4.2" "pytest>=8.3,<10" "ruff>=0.8,<1"
          python -m pip install --no-deps -e .
          python - <<'PY'
          import torch
          import torchvision

          assert torch.__version__.startswith("2.9.1"), torch.__version__
          assert torchvision.__version__.startswith("0.24.1"), torchvision.__version__
          PY
      - name: Public-tree hygiene
        run: python scripts/check_public_tree.py
      - name: Lint and compile
        run: |
          python -m ruff check src tests scripts
          python -m compileall -q src scripts tests
      - name: Unit tests
        run: python -m pytest -q
